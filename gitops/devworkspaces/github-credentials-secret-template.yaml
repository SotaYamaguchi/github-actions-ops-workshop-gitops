# GitHub Credentials Secret Template for DevSpaces
#
# このテンプレートを使って、各ユーザーの namespace に GitHub 認証情報を作成してください。
#
# 使い方:
#   1. <GITHUB_USERNAME> を実際の GitHub ユーザー名に置換
#   2. <GITHUB_PAT> を Personal Access Token に置換
#   3. user-01 〜 user-15 の各 namespace に apply
#
# 必要な GitHub PAT 権限:
#   - repo (private リポジトリへのアクセス)
#
# 一括適用例:
#   for i in {01..15}; do
#     sed "s/user-01/user-$i/" github-credentials-secret-template.yaml | \
#     sed "s/<GITHUB_USERNAME>/your-username/" | \
#     sed "s/<GITHUB_PAT>/ghp_xxxxxxxxxxxx/" | \
#     oc apply -f -
#   done
#
---
apiVersion: v1
kind: Secret
metadata:
  name: github-credentials
  namespace: user-01-devspaces
  labels:
    controller.devfile.io/devworkspace_pullrequest_github: 'true'
    controller.devfile.io/watch-secret: 'true'
  annotations:
    controller.devfile.io/git-credential: 'true'
type: Opaque
stringData:
  credentials: https://<GITHUB_USERNAME>:<GITHUB_PAT>@github.com
