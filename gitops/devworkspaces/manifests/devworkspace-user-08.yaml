apiVersion: workspace.devfile.io/v1alpha2
kind: DevWorkspace
metadata:
  name: github-actions-workshop
  namespace: user-08-devspaces
  annotations:
    che.eclipse.org/che-editor: che-incubator/che-code/latest
spec:
  routingClass: che
  started: true
  contributions:
    - name: ide
      uri: http://devspaces-dashboard.openshift-devspaces.svc.cluster.local:8080/dashboard/api/editors/devfile?che-editor=che-incubator/che-code/latest
  template:
    projects:
    - git:
        checkoutFrom:
          revision: user-08
        remotes:
          origin: https://github.com/SotaYamaguchi/github-actions-ops-workshop.git
      name: github-actions-ops-workshop
