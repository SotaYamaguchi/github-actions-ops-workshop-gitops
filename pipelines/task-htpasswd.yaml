apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: create-htpasswd
  namespace: openshift-pipelines
spec:
  params:
  - name: num-users
    type: string
    default: "15"
  - name: password
    type: string
    default: "Workshop2026!"

  steps:
  - name: generate-htpasswd
    image: registry.redhat.io/ubi9/ubi:latest
    script: |
      #!/bin/bash
      set -e

      echo "=== HTPasswd ファイル生成 ==="

      # htpasswd コマンドをインストール
      dnf install -y httpd-tools

      # HTPasswd ファイル生成
      for i in $(seq -w 1 $(params.num-users)); do
        if [ $i -eq 1 ]; then
          htpasswd -c -B -b /tmp/htpasswd user-$i "$(params.password)"
        else
          htpasswd -B -b /tmp/htpasswd user-$i "$(params.password)"
        fi
        echo "Created: user-$i"
      done

      echo ""
      echo "✓ HTPasswd ファイル生成完了"
      wc -l /tmp/htpasswd

      # Secret 作成（既存の場合は削除して再作成）
      oc delete secret htpass-secret -n openshift-config --ignore-not-found=true
      oc create secret generic htpass-secret \
        --from-file=htpasswd=/tmp/htpasswd \
        -n openshift-config

      echo "✓ Secret htpass-secret 作成完了"
